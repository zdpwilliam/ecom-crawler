<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>demo 商品详情（评论 + 问答）</title></head>
<body>
  <h1 class="title">Aurora 轻奢双肩包 2025 黑色</h1>

  <section class="review-list">
    <div class="review-card">
      <span class="rating">5星</span>
      <p class="content">包包很漂亮，容量也够大，物流很快。</p>
      <span class="author">买家中奖体质</span>
    </div>
    <div class="review-card">
      <span class="rating">4星</span>
      <p class="content">做工不错，就是价格略贵，整体满意。</p>
      <span class="author">理性消费君</span>
    </div>
    <div class="review-card">
      <span class="rating">2星</span>
      <p class="content">和图片有色差，客服回复慢。</p>
      <span class="author">普通用户</span>
    </div>
  </section>

  <section class="qa-list">
    <div class="qa-item">
      <div class="q">这款双肩包能装下 15 寸笔记本吗？</div>
      <div class="a">可以的，主仓专为 15.6 寸笔记本设计，内衬加厚防刮。</div>
      <span class="asker">好奇宝宝</span>
    </div>
    <div class="qa-item">
      <div class="q">有没有发票？支持七天无理由吗？</div>
      <div class="a">支持开具电子发票，签收后 7 天内可申请无理由退换。</div>
      <span class="asker">精打细算</span>
    </div>
    <div class="qa-item">
      <div class="q">防水吗？下雨天能用吗？</div>
      <div class="a">面料为防泼水材质，小雨无碍，不建议暴雨长时间使用。</div>
      <span class="asker">户外达人</span>
    </div>
  </section>
</body>
</html>
